# ==================== Base de datos ====================
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# ==================== Kafka ====================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP}

# ==================== JWT (llave pública de identity) ====================
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${IDENTITY_JWKS_URI}

# ==================== Clave interna compartida ====================
app.internal.api-key=${INTERNAL_API_KEY}

# ==================== Comunicación con otros servicios ====================
app.trip.base-url=${TRIP_SERVICE_URL}
app.trip.api-key=${INTERNAL_API_KEY}
app.identity.base-url=${IDENTITY_URL}
app.identity.api-key=${INTERNAL_API_KEY}

# ==================== S3 (fotos) ====================
app.storage.s3.bucket=${S3_BUCKET}
app.storage.s3.region=${AWS_REGION}

# ==================== Observabilidad ====================
management.endpoint.health.show-details=never
logging.level.root=INFO