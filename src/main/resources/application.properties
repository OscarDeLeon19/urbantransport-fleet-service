# ===== Aplicación =====
spring.application.name=fleet-service
server.port=${SERVER_PORT:8082}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
app.zone=America/Guatemala

# ===== Base de datos =====
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fleet_db}
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD:admin}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:29092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.consumer.group-id=fleet-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=record

app.kafka.topic.fleet-events=fleet-events
app.kafka.topic.identity-events=identity-events
app.kafka.topic.trip-events=trip-events

app.jobs.outbox.fixed-delay-ms=2000
app.jobs.license-alerts.cron=0 0 7 * * *

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${IDENTITY_JWKS_URI:http://localhost:8081/.well-known/jwks.json}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.storage.photos-dir=${PHOTOS_DIR:./data/photos}
app.storage.public-base-url=${PHOTOS_BASE_URL:http://localhost:8082/files}

app.services.trip-url=${TRIP_SERVICE_URL:http://localhost:8083}

resilience4j.circuitbreaker.instances.tripService.sliding-window-size=10
resilience4j.circuitbreaker.instances.tripService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.tripService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.tripService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.tripService.permitted-number-of-calls-in-half-open-state=2
resilience4j.timelimiter.instances.tripService.timeout-duration=3s
resilience4j.retry.instances.tripService.max-attempts=3
resilience4j.retry.instances.tripService.wait-duration=500ms

# ===== Observabilidad y documentación =====
management.endpoints.web.exposure.include=health,info,circuitbreakers
management.endpoint.health.show-details=always
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html